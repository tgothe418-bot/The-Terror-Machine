<!doctype html>
<html lang="en" class="bg-black" style="background-color: #000; color: #fff;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Terror Machine</title>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && (!root.childNodes || root.childNodes.length === 0)) {
          root.innerHTML =
            '<div style="min-height: 100vh; background: #000; color: #ef4444; font-family: monospace; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">' +
            '<div style="border: 1px solid #7f1d1d; background: rgba(127, 29, 29, 0.2); padding: 1.5rem; border-radius: 0.5rem; max-width: 40rem; width: 100%;">' +
            '<h1 style="font-size: 1.125rem; font-weight: bold; letter-spacing: 0.1em; margin-bottom: 0.5rem;">[ SCRIPT INITIALIZATION ERROR ]</h1>' +
            '<p style="color: #d4d4d8; font-size: 0.875rem; margin-bottom: 1rem;">' + (event.message || 'An error occurred while loading script modules.') + '</p>' +
            '<p style="color: #71717a; font-size: 0.75rem;">Check the browser DevTools console (F12) for detailed diagnostics.</p>' +
            '</div></div>';
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var root = document.getElementById('root');
        if (root && (!root.childNodes || root.childNodes.length === 0)) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack)) ? (reason.message || reason.stack) : String(reason);
          root.innerHTML =
            '<div style="min-height: 100vh; background: #000; color: #ef4444; font-family: monospace; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">' +
            '<div style="border: 1px solid #7f1d1d; background: rgba(127, 29, 29, 0.2); padding: 1.5rem; border-radius: 0.5rem; max-width: 40rem; width: 100%;">' +
            '<h1 style="font-size: 1.125rem; font-weight: bold; letter-spacing: 0.1em; margin-bottom: 0.5rem;">[ PROMISE INITIALIZATION ERROR ]</h1>' +
            '<p style="color: #d4d4d8; font-size: 0.875rem; margin-bottom: 1rem;">' + (msg || 'An unhandled rejection occurred during module initialization.') + '</p>' +
            '<p style="color: #71717a; font-size: 0.75rem;">Check the browser DevTools console (F12) for detailed diagnostics.</p>' +
            '</div></div>';
        }
      });
    </script>
  </head>
  <body class="bg-black text-zinc-100" style="background-color: #000; color: #fff; margin: 0; min-height: 100vh;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
